# kind cluster tuned for ingress-nginx: the control-plane node is labelled
# `ingress-ready=true` and exposes host ports 80/443 so the Ingress is
# reachable from the host at http://<host>:80.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: url-shortener
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
