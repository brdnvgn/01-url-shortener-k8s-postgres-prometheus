apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api
  namespace: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener-api
    app.kubernetes.io/part-of: url-shortener
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: url-shortener-api
  ports:
    # Named "http" so the ServiceMonitor can reference it by name for scraping.
    - name: http
      port: 80
      targetPort: http
