# Demo credentials for the lab only. In a real setup, keep secrets out of git
# (e.g. sealed-secrets, SOPS, or an external secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secrets
  namespace: url-shortener
  labels:
    app.kubernetes.io/part-of: url-shortener
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: url_shortener
  # Consumed by the API (pydantic reads DATABASE_URL -> settings.database_url).
  # Host "postgres" resolves to the headless Service in the same namespace.
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url_shortener
